{% extends "base.html" %}
{% import "_ui.html" as ui %}

{% block title %}開發用登入{% endblock %}

{% block content %}
<div class="narrow stack-lg">
    {{ ui.page_head('開發用登入（假的 router）', sub='這一頁只在開發環境出現，用來代替 router 的授權頁。正式環境沒有這一頁。') }}
    <form method="post" class="form-card">
        {% for name in ['redirect_uri', 'state', 'code_challenge', 'nonce'] %}
        <input type="hidden" name="{{ name }}" value="{{ params.get(name, '') }}">
        {% endfor %}
        <div class="fld">
            <label for="user_id">router 使用者編號</label>
            <input class="inp" type="number" id="user_id" name="user_id" value="1" min="1" required>
        </div>
        <div class="fld">
            <label for="display_name">顯示名稱</label>
            <input class="inp" type="text" id="display_name" name="display_name" value="開發老師">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">以這位老師登入</button>
        </div>
    </form>
</div>
{% endblock %}
