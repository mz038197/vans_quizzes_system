{% extends "base.html" %}

{% block title %}開發用登入{% endblock %}

{% block content %}
<div class="card" style="max-width: 480px; margin: 2rem auto;">
    <div class="card-header">
        <h3>開發用登入（假的 router）</h3>
    </div>
    <div class="card-body">
        <p style="color: #666;">這一頁只在開發環境出現，用來代替 router 的授權頁。正式環境沒有這一頁。</p>
        <form method="post">
            {% for name in ['redirect_uri', 'state', 'code_challenge', 'nonce'] %}
            <input type="hidden" name="{{ name }}" value="{{ params.get(name, '') }}">
            {% endfor %}
            <div class="form-group">
                <label for="user_id">router 使用者編號</label>
                <input type="number" id="user_id" name="user_id" value="1" min="1" required>
            </div>
            <div class="form-group">
                <label for="display_name">顯示名稱</label>
                <input type="text" id="display_name" name="display_name" value="開發老師">
            </div>
            <button type="submit" class="btn">以這位老師登入</button>
        </form>
    </div>
</div>
{% endblock %}
