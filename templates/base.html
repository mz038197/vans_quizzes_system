<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}智慧題庫 - 線上教學平台{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- MathJax for LaTeX support -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    
    {% block head %}{% endblock %}
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <h1><i class="fas fa-book"></i> 智慧題庫</h1>
            <div class="nav-links">
                {% if current_teacher %}
                    <a href="{{ url_for('teacher_dashboard') }}" class="{{ 'active' if request.endpoint == 'teacher_dashboard' else '' }}">
                        <i class="fas fa-tachometer-alt"></i> 儀表板
                    </a>
                    <a href="{{ url_for('create_quiz_bank') }}" class="{{ 'active' if request.endpoint == 'create_quiz_bank' else '' }}">
                        <i class="fas fa-plus-circle"></i> 新增題庫
                    </a>
                    <form method="post" action="{{ url_for('teacher_auth.logout') }}" class="nav-logout-form">
                        <button type="submit" class="nav-logout">
                            <i class="fas fa-sign-out-alt"></i> 登出 ({{ current_teacher.display_name }})
                        </button>
                    </form>
                {% else %}
                    <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">
                        <i class="fas fa-home"></i> 首頁
                    </a>
                    <a href="{{ url_for('teacher_auth.login') }}">
                        <i class="fas fa-sign-in-alt"></i> 教師登入
                    </a>
                {% endif %}
            </div>
        </nav>
        
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
