{# The bottom action bar for deleting several Submissions (static/js/submission_delete.js). #}
<div id="bulk-bar" class="bulk-bar" role="region" aria-label="批次操作" hidden>
  <span data-bulk-count aria-live="polite"></span>
  <button type="button" class="btn" data-bulk-clear>取消選取</button>
  <button type="button" class="btn btn-danger" data-bulk-delete></button>
</div>
